suite: Secrets template
templates:
  - templates/secrets.tpl

tests:
  - it: renders Secrets with environment variables
    set:
      secrets:
        envVars:
          data:
            DATABASE_PASSWORD: secret-password
            API_KEY: secret-api-key
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-env-vars
      - equal:
          path: data.DATABASE_PASSWORD
          value: c2VjcmV0LXBhc3N3b3Jk
      - equal:
          path: data.API_KEY
          value: c2VjcmV0LWFwaS1rZXk=

  - it: renders Secrets with file data
    set:
      secrets:
        files:
          data:
            "tls.crt": |
              -----BEGIN CERTIFICATE-----
              MIICert...
              -----END CERTIFICATE-----
            "tls.key": |
              -----BEGIN PRIVATE KEY-----
              MIIKey...
              -----END PRIVATE KEY-----
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-files
      - equal:
          path: data["tls.crt"]
          value: |
            LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNlcnQuLi4KLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
      - equal:
          path: data["tls.key"]
          value: |
            LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1JSUtleS4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0t

  - it: renders multiple Secrets when both files and envVars are defined
    set:
      secrets:
        files:
          data:
            "cert.pem": "certificate content"
        envVars:
          data:
            SECRET_TOKEN: token-value
    asserts:
      - hasDocuments:
          count: 2

  - it: renders Secret with custom name and type
    set:
      secrets:
        tls-secret:
          type: kubernetes.io/tls
          data:
            tls.crt: certificate-data
            tls.key: private-key-data
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-tls-secret
      - equal:
          path: type
          value: kubernetes.io/tls
      - isNotEmpty:
          path: data["tls.crt"]
      - isNotEmpty:
          path: data["tls.key"]

  - it: renders Secret with annotations
    set:
      secrets:
        files:
          metadata:
            annotations:
              custom-annotation: custom-value
              another-annotation: another-value
          data:
            "test.key": "test content"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: custom-value
      - equal:
          path: metadata.annotations["another-annotation"]
          value: another-value

  - it: should not render when secrets.files.enabled is false
    set:
      secrets:
        files:
          enabled: false
          data:
            "test.key": "test content"
        envVars:
          data:
            SECRET_TOKEN: token-value
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-env-vars

  - it: should not render when secrets.envVars.enabled is false
    set:
      secrets:
        files:
          data:
            "test.key": "test content"
        envVars:
          enabled: false
          data:
            SECRET_TOKEN: token-value
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-files

  - it: should not render when secrets data is empty
    set:
      secrets:
        files:
          data: {}
        envVars:
          data: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when secrets data is not defined
    set:
      secrets:
        files: {}
        envVars: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render files secret when only files data is empty
    set:
      secrets:
        files:
          data: {}
        envVars:
          data:
            SECRET_TOKEN: token-value
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-env-vars

  - it: should not render envVars secret when only envVars data is empty
    set:
      secrets:
        files:
          data:
            "test.key": "test content"
        envVars:
          data: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-files

  - it: should render with default enabled state
    set:
      secrets:
        envVars:
          data:
            SECRET_TOKEN: token-value
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-env-vars

  - it: renders Secret with custom labels
    set:
      secrets:
        envVars:
          metadata:
            labels:
              custom-label: custom-value
              environment: production
          data:
            SECRET_TOKEN: token-value
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.labels["custom-label"]
          value: custom-value
      - equal:
          path: metadata.labels["environment"]
          value: production
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: base-test
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: renders Secret with both custom labels and annotations
    set:
      secrets:
        envVars:
          metadata:
            labels:
              team: backend
            annotations:
              description: "API secrets"
              owner: "platform-team"
          data:
            API_KEY: secret-key
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.labels["team"]
          value: backend
      - equal:
          path: metadata.annotations["description"]
          value: "API secrets"
      - equal:
          path: metadata.annotations["owner"]
          value: "platform-team"

  - it: renders Secret with stringData
    set:
      secrets:
        config:
          stringData:
            username: admin
            password: super-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-config
      - equal:
          path: stringData.username
          value: admin
      - equal:
          path: stringData.password
          value: super-secret

  - it: renders Secret with mixed data and stringData
    set:
      secrets:
        mixed:
          data:
            encoded-key: dGVzdC12YWx1ZQ==
          stringData:
            plain-key: plain-value
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-mixed
      - equal:
          path: data["encoded-key"]
          value: dGVzdC12YWx1ZQ==
      - equal:
          path: stringData["plain-key"]
          value: plain-value

  - it: renders Secret with custom type and stringData
    set:
      secrets:
        docker-registry:
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: |
              {
                "auths": {
                  "registry.example.com": {
                    "username": "user",
                    "password": "pass"
                  }
                }
              }
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-docker-registry
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - isNotEmpty:
          path: stringData[".dockerconfigjson"]

  - it: renders Secret with templated values
    release:
      name: test-app
      namespace: production
    set:
      secrets:
        config:
          metadata:
            annotations:
              app-name: "{{ .Release.Name }}"
              namespace: "{{ .Release.Namespace }}"
          stringData:
            app-name: "{{ .Release.Name }}"
            environment: production
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["app-name"]
          value: test-app
      - equal:
          path: metadata.annotations["namespace"]
          value: production
      - equal:
          path: stringData["app-name"]
          value: test-app

  - it: renders files Secret with different file types
    set:
      secrets:
        files:
          data:
            "config.yaml":
              database:
                host: db.example.com
            "config.json":
              api:
                endpoint: "https://api.example.com"
            "config.toml":
              server:
                port: 8080
            "simple.txt": "plain text content"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-files
      - isNotEmpty:
          path: data["config"]
      - isNotEmpty:
          path: data["config"]
      - isNotEmpty:
          path: data["config"]
      - isNotEmpty:
          path: data["simple.txt"]

  - it: should not render Secret with empty metadata annotations
    set:
      secrets:
        envVars:
          metadata:
            annotations: {}
          data:
            SECRET_TOKEN: token-value
    asserts:
      - isKind:
          of: Secret
      - notExists:
          path: metadata.annotations

  - it: renders Secret with explicit Opaque type
    set:
      secrets:
        basic:
          type: Opaque
          data:
            key: value
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque

  - it: renders multiple Secrets with different configurations
    set:
      secrets:
        database:
          type: Opaque
          metadata:
            labels:
              component: database
            annotations:
              description: "Database credentials"
          stringData:
            username: dbuser
            password: dbpass
        registry:
          type: kubernetes.io/dockerconfigjson
          metadata:
            labels:
              component: registry
          stringData:
            .dockerconfigjson: '{"auths":{}}'
        tls:
          type: kubernetes.io/tls
          data:
            tls.crt: Y2VydGlmaWNhdGU=
            tls.key: cHJpdmF0ZWtleQ==
    asserts:
      - hasDocuments:
          count: 3

  - it: envVars type should base64 encode data values
    set:
      secrets:
        envVars:
          data:
            DATABASE_PASSWORD: my-secret-password
            API_KEY: super-secret-key-123
            TOKEN: "special-chars!@#$%"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.DATABASE_PASSWORD
          value: bXktc2VjcmV0LXBhc3N3b3Jk
      - equal:
          path: data.API_KEY
          value: c3VwZXItc2VjcmV0LWtleS0xMjM=
      - equal:
          path: data.TOKEN
          value: c3BlY2lhbC1jaGFycyFAIyQl
      - notExists:
          path: stringData

  - it: envVars type should fail when stringData is provided
    set:
      secrets:
        envVars:
          data:
            KEY: value
          stringData:
            PLAIN_KEY: plain-value
    asserts:
      - failedTemplate:
          errorMessage: "secrets.envVars does not support 'stringData'"

  - it: files type should fail when stringData is provided
    set:
      secrets:
        files:
          data:
            "config.txt": "text content"
          stringData:
            plain.txt: "plain text"
    asserts:
      - failedTemplate:
          errorMessage: "secrets.files does not support 'stringData'"

  - it: files type should convert map to YAML and base64 encode for .yaml files
    set:
      secrets:
        files:
          data:
            "/app/config.yaml":
              database:
                host: db.example.com
                port: 5432
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data["___app___config.yaml"]
          value: |
            ZGF0YWJhc2U6CiAgaG9zdDogZGIuZXhhbXBsZS5jb20KICBwb3J0OiA1NDMy

  - it: files type should convert map to JSON and base64 encode for .json files
    set:
      secrets:
        files:
          data:
            "/app/api-config.json":
              endpoint: "https://api.example.com"
              timeout: 30
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data["___app___api-config.json"]
          value: |
            eyJlbmRwb2ludCI6Imh0dHBzOi8vYXBpLmV4YW1wbGUuY29tIiwidGltZW91dCI6MzB9

  - it: files type should convert map to TOML and base64 encode for .toml files
    set:
      secrets:
        files:
          data:
            "/app/server.toml":
              server:
                host: "0.0.0.0"
                port: 8080
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data["___app___server.toml"]
          value: |
            W3NlcnZlcl0KICBob3N0ID0gIjAuMC4wLjAiCiAgcG9ydCA9IDgwODAuMAo=

  - it: files type should base64 encode string data as-is regardless of extension
    set:
      secrets:
        files:
          data:
            "/app/certificate.pem": |
              -----BEGIN CERTIFICATE-----
              MIICertificateDataHere
              -----END CERTIFICATE-----
            "/app/preformatted.json": |
              {"already": "formatted"}
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data["___app___certificate.pem"]
          value: |
            LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNlcnRpZmljYXRlRGF0YUhlcmUKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
      - equal:
          path: data["___app___preformatted.json"]
          value: |
            eyJhbHJlYWR5IjogImZvcm1hdHRlZCJ9

  - it: files type should handle templated key names
    release:
      name: my-app
    set:
      secrets:
        files:
          data:
            "{{ .Release.Name }}-config.yaml":
              key: value
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data["my-app-config.yaml"]
          value: |
            a2V5OiB2YWx1ZQ==

  - it: custom type (others) should support both data and stringData
    set:
      secrets:
        custom-secret:
          type: Opaque
          data:
            encoded.key: bXktc2VjcmV0
          stringData:
            plain.key: "plain-text-secret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-custom-secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data["encoded.key"]
          value: bXktc2VjcmV0
      - equal:
          path: stringData["plain.key"]
          value: "plain-text-secret"

  - it: custom type (others) should support templating in data
    release:
      name: test-release
      namespace: test-namespace
    set:
      secrets:
        templated:
          data:
            app-name: "{{ .Release.Name }}"
            namespace: "{{ .Release.Namespace }}"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data["app-name"]
          value: test-release
      - equal:
          path: data["namespace"]
          value: test-namespace

  - it: custom type (others) should support templating in stringData
    release:
      name: test-release
      namespace: test-namespace
    set:
      secrets:
        templated:
          stringData:
            app-name: "{{ .Release.Name }}"
            namespace: "{{ .Release.Namespace }}"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData["app-name"]
          value: test-release
      - equal:
          path: stringData["namespace"]
          value: test-namespace

  - it: custom type (others) should handle nested data structures
    set:
      secrets:
        complex:
          data:
            config:
              nested:
                level1:
                  level2: "deep-secret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.config.nested.level1.level2
          value: "deep-secret"

  - it: envVars type should handle templated values in data
    release:
      name: my-app
    set:
      secrets:
        envVars:
          data:
            APP_NAME: "{{ .Release.Name }}"
            DATABASE_URL: "postgres://{{ .Release.Name }}-db:5432/db"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.APP_NAME
          value: bXktYXBw
      - equal:
          path: data.DATABASE_URL
          value: cG9zdGdyZXM6Ly9teS1hcHAtZGI6NTQzMi9kYg==
