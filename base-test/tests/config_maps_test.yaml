suite: ConfigMaps template
templates:
  - templates/config_maps.tpl

tests:
  - it: different format of files
    set:
      configMaps:
        files:
          data:
            "/app/file.txt": |
              content
            "/app/file.json":
              key: value
            "/app/file.yaml":
              key: value
            "/app/file.toml":
              key: value
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-files
      - equal:
          path: data["___app___file.txt"]
          value: |
            content
      - equal:
          path: data["___app___file.json"]
          value: |
            {"key":"value"}
      - equal:
          path: data["___app___file.yaml"]
          value: |
            key: value
      - equal:
          path: data["___app___file.toml"]
          value: |
            key = "value"

  - it: renders ConfigMaps with environment variables
    set:
      configMaps:
        envVars:
          data:
            DATABASE_URL: postgresql://localhost:5432/mydb
            LOG_LEVEL: info
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-env-vars
      - equal:
          path: data.DATABASE_URL
          value: postgresql://localhost:5432/mydb
      - equal:
          path: data.LOG_LEVEL
          value: info

  - it: renders multiple ConfigMaps when both files and envVars are defined
    set:
      configMaps:
        files:
          data:
            "config.yaml": |
              server:
                port: 8080
        envVars:
          data:
            APP_ENV: production
    asserts:
      - hasDocuments:
          count: 2

  - it: renders ConfigMap with custom name
    set:
      configMaps:
        custom-config:
          data:
            key1: value1
            key2: value2
          binaryData:
            certificate.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-custom-config
      - equal:
          path: data.key1
          value: value1
      - equal:
          path: binaryData["certificate.crt"]
          value: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t

  - it: renders ConfigMap with annotations
    set:
      configMaps:
        files:
          metadata:
            annotations:
              custom-annotation: custom-value
          data:
            "test.conf": "test content"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: custom-value

  - it: should not render when configMaps is disabled
    set:
      configMaps:
        files:
          enabled: false
          data:
            "config.yaml": |
              server:
                port: 8080
        envVars:
          enabled: false
          data:
            APP_ENV: production
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when no data is defined
    set:
      configMaps:
        files:
          data: {}
        envVars:
          data: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders ConfigMap with custom labels
    set:
      configMaps:
        custom-config:
          metadata:
            labels:
              environment: production
              tier: backend
              version: v1.2.3
          data:
            config.yaml: |
              database:
                host: localhost
                port: 5432
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-custom-config
      - equal:
          path: metadata.labels.environment
          value: production
      - equal:
          path: metadata.labels.tier
          value: backend
      - equal:
          path: metadata.labels.version
          value: v1.2.3
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: base-test
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: renders ConfigMap with templated values
    release:
      name: test-app
      namespace: production
    set:
      configMaps:
        config:
          metadata:
            annotations:
              app-name: "{{ .Release.Name }}"
              namespace: "{{ .Release.Namespace }}"
          data:
            app-name: "{{ .Release.Name }}"
            environment: production
            chart-name: "{{ .Chart.Name }}"
            release-info: "App {{ .Release.Name }} in {{ .Release.Namespace }}"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.annotations["app-name"]
          value: test-app
      - equal:
          path: metadata.annotations["namespace"]
          value: production
      - equal:
          path: data["app-name"]
          value: test-app
      - equal:
          path: data["environment"]
          value: production
      - equal:
          path: data["chart-name"]
          value: base-test
      - equal:
          path: data["release-info"]
          value: "App test-app in production"

  - it: envVars type should quote all data values
    set:
      configMaps:
        envVars:
          data:
            NUMERIC_VALUE: 12345
            BOOLEAN_VALUE: true
            STRING_VALUE: hello world
            SPECIAL_CHARS: "key=value&test=123"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.NUMERIC_VALUE
          value: "12345"
      - equal:
          path: data.BOOLEAN_VALUE
          value: "true"
      - equal:
          path: data.STRING_VALUE
          value: "hello world"
      - equal:
          path: data.SPECIAL_CHARS
          value: "key=value&test=123"

  - it: envVars type should fail when binaryData is provided
    set:
      configMaps:
        envVars:
          data:
            KEY: value
          binaryData:
            binary.data: QUJD
    asserts:
      - failedTemplate:
          errorMessage: "configMaps.envVars does not support 'binaryData'"

  - it: files type should fail when binaryData is provided
    set:
      configMaps:
        files:
          data:
            "config.txt": "text content"
          binaryData:
            binary.data: QUJD
    asserts:
      - failedTemplate:
          errorMessage: "configMaps.files does not support 'binaryData'"

  - it: files type should convert map to YAML when file has .yaml extension
    set:
      configMaps:
        files:
          data:
            "/app/config.yaml":
              server:
                host: localhost
                port: 8080
                settings:
                  - debug: true
                  - verbose: false
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["___app___config.yaml"]
          pattern: "server:"

  - it: files type should convert map to JSON when file has .json extension
    set:
      configMaps:
        files:
          data:
            "/app/config.json":
              api:
                endpoint: "https://example.com"
                timeout: 30
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["___app___config.json"]
          pattern: '^\s*\{"api":\{"endpoint":"https://example.com","timeout":30\}\}\s*$'

  - it: files type should convert map to TOML when file has .toml extension
    set:
      configMaps:
        files:
          data:
            "/app/config.toml":
              database:
                host: "localhost"
                port: 5432
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["___app___config.toml"]
          pattern: 'host = "localhost"'

  - it: files type should keep string data as-is regardless of extension
    set:
      configMaps:
        files:
          data:
            "/app/script.sh": |
              #!/bin/bash
              echo "Hello World"
            "/app/preformatted.json": |
              {"already": "formatted", "as": "string"}
            "/app/config.yaml": |
              server:
                port: 8080
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data["___app___script.sh"]
          value: |
            #!/bin/bash
            echo "Hello World"
      - equal:
          path: data["___app___preformatted.json"]
          value: |
            {"already": "formatted", "as": "string"}
      - equal:
          path: data["___app___config.yaml"]
          value: |
            server:
              port: 8080

  - it: custom type (others) should support both data and binaryData
    set:
      configMaps:
        custom-config:
          data:
            regular.txt: "plain text"
            number.val: 42
          binaryData:
            binary.bin: QUJDREVGR0g=
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-base-test-custom-config
      - equal:
          path: data["regular.txt"]
          value: "plain text"
      - equal:
          path: data["number.val"]
          value: 42
      - equal:
          path: binaryData["binary.bin"]
          value: QUJDREVGR0g=

  - it: custom type (others) should handle nested structures in data
    set:
      configMaps:
        complex-config:
          data:
            nested:
              level1:
                level2: "deep value"
            array:
              - item1
              - item2
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.nested.level1.level2
          value: "deep value"
      - equal:
          path: data.array[0]
          value: item1
